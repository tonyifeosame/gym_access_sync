<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Logs &middot; Gym Access Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content">
      <div id="pageAlert" class="alert alert-danger d-none"></div>

      <div class="card">
        <div class="card-header bg-white d-flex flex-wrap gap-2 align-items-end justify-content-between">
          <div class="d-flex flex-wrap gap-2 align-items-end">
            <div>
              <label class="form-label small mb-1">Filter by date</label>
              <input type="date" class="form-control form-control-sm" id="dateFilter" />
            </div>
            <div>
              <label class="form-label small mb-1">Filter by Member ID</label>
              <input type="text" class="form-control form-control-sm" id="memberFilter" placeholder="e.g. MEM001" />
            </div>
            <button class="btn btn-sm btn-primary" id="applyBtn"><i class="bi bi-funnel"></i> Apply</button>
            <button class="btn btn-sm btn-outline-secondary" id="clearBtn">Clear</button>
          </div>
          <span class="text-muted small" id="logCount"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Date / Time</th>
                  <th>Member ID</th>
                  <th>Result</th>
                  <th>Reason</th>
                  <th>Source / Device</th>
                </tr>
              </thead>
              <tbody id="logRows">
                <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
