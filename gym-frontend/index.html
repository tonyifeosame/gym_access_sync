<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login &middot; Gym Access Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card p-4">
      <div class="login-logo"><i class="bi bi-shield-lock"></i></div>
      <h4 class="text-center mb-1">Gym Access Portal</h4>
      <p class="text-center text-muted mb-4">Staff sign in</p>

      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">API Server URL</label>
          <input type="text" class="form-control" id="baseUrl" value="http://localhost:8080" required />
        </div>
        <div class="mb-3">
          <label class="form-label">API Key</label>
          <input type="password" class="form-control" id="apiKey" value="gym-secret-key" required />
          <div class="form-text">Sent as the <code>X-API-Key</code> header on every request.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Already logged in? Skip to dashboard.
    if (API.isAuthenticated()) {
      window.location.replace("dashboard.html");
    }

    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("loginAlert");
    const btn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("d-none");
      const baseUrl = document.getElementById("baseUrl").value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
      try {
        await API.login(baseUrl, apiKey);
        window.location.replace("dashboard.html");
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove("d-none");
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
      }
    });
  </script>
</body>
</html>
