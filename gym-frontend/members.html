<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members &middot; Gym Access Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content">
      <div id="pageAlert" class="alert alert-danger d-none"></div>

      <div class="card">
        <div class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
          <div class="input-group" style="max-width: 320px;">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="searchInput" placeholder="Search by name, ID, status..." />
          </div>
          <button class="btn btn-primary" id="addMemberBtn">
            <i class="bi bi-plus-lg"></i> Add Member
          </button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Member ID</th>
                  <th>Full Name</th>
                  <th>Status</th>
                  <th>Expiring Date</th>
                  <th>Last Updated</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="memberRows">
                <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal fade" id="memberModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="memberForm">
          <div class="modal-header">
            <h5 class="modal-title" id="memberModalTitle">Add Member</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalAlert" class="alert alert-danger d-none"></div>
            <div class="mb-3">
              <label class="form-label">Member ID <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="m_id" required />
              <div class="form-text" id="m_id_help">Unique ID, e.g. MEM001.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="m_name" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Membership Expiring Date</label>
              <input type="date" class="form-control" id="m_expiring" />
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="m_status">
                <option value="PENDING_ENROLLMENT">Pending Enrollment</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="memberSaveBtn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View modal -->
  <div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Member Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="viewBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
